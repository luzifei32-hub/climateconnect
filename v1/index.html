/* Motion system — animated ClimateConnect classroom prototype */
:root{--motion:cubic-bezier(.22,1,.36,1)}
@keyframes ccPageOutLeft{to{opacity:0;transform:translate3d(-17px,0,0) scale(.985);filter:blur(2px)}}
@keyframes ccPageOutRight{to{opacity:0;transform:translate3d(17px,0,0) scale(.985);filter:blur(2px)}}
@keyframes ccPageInRight{from{opacity:0;transform:translate3d(24px,8px,0) scale(.98);filter:blur(4px)}to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
@keyframes ccPageInLeft{from{opacity:0;transform:translate3d(-24px,8px,0) scale(.98);filter:blur(4px)}to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
@keyframes ccContentIn{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
@keyframes ccFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-11px) rotate(2deg)}}
@keyframes ccBreathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
@keyframes ccOrbit{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ccSpinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes ccWelcomeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes ccGlassIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ccPop{0%{transform:scale(.45);opacity:0}65%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ccParticle{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.2)}18%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--spin)) scale(.75)}}
@keyframes ccShield{0%,100%{box-shadow:0 0 0 0 #c1eac630}50%{box-shadow:0 0 0 15px #c1eac600}}
@keyframes ccProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.scroll-view{transform-origin:50% 40%;will-change:transform,opacity}
.scroll-view.page-out-left{animation:ccPageOutLeft .17s ease-in both;pointer-events:none}
.scroll-view.page-out-right{animation:ccPageOutRight .17s ease-in both;pointer-events:none}
.scroll-view.page-enter-right{animation:ccPageInRight .5s var(--motion) both}
.scroll-view.page-enter-left{animation:ccPageInLeft .5s var(--motion) both}
.scroll-view.page-enter-right > :nth-child(-n+7),.scroll-view.page-enter-left > :nth-child(-n+7){animation:ccContentIn .47s var(--motion) both}
.scroll-view.page-enter-right > :nth-child(2),.scroll-view.page-enter-left > :nth-child(2){animation-delay:.045s}
.scroll-view.page-enter-right > :nth-child(3),.scroll-view.page-enter-left > :nth-child(3){animation-delay:.08s}
.scroll-view.page-enter-right > :nth-child(4),.scroll-view.page-enter-left > :nth-child(4){animation-delay:.12s}
.scroll-view.page-enter-right > :nth-child(5),.scroll-view.page-enter-left > :nth-child(5){animation-delay:.16s}
.scroll-view.page-enter-right > :nth-child(6),.scroll-view.page-enter-left > :nth-child(6){animation-delay:.19s}
.hero-art{animation:ccFloat 5.2s ease-in-out infinite;transform-origin:60% 80%}
.hero::before{content:'✦';position:absolute;right:18%;top:23px;font-size:16px;color:#69a5808c;animation:ccBreathe 3s ease-in-out infinite}
.score-summary::after{animation:ccFloat 6s ease-in-out infinite}
.progress-bar > div{transform-origin:left;animation:ccProgress .75s var(--motion) both}
.nav-btn.active .nav-icon{animation:ccPop .36s var(--motion) both}
.nav-btn:active,.icon-btn:active,.btn-solid:active,.btn-outline:active,.hero-btn:active,.complete-btn:active{transform:scale(.94)}
.nav-btn,.btn-solid,.btn-outline,.hero-btn,.complete-btn,.article-card,.icon-btn{transition:transform .2s var(--motion),box-shadow .24s ease,background .2s ease}
@media(hover:hover){.article-card:hover,.challenge:hover{transform:translateY(-3px);box-shadow:0 12px 22px #2e77511c}.hero-btn:hover,.btn-solid:hover{box-shadow:0 10px 22px #25634a45;transform:translateY(-2px)}.icon-btn:hover{background:#edf6ed}}
.sheet{animation:ccGlassIn .33s var(--motion) both}.modal-backdrop{animation:ccWelcomeIn .2s ease both}
.top-actions{display:flex;align-items:center;gap:6px}.sparkle-btn{color:#2d8060;background:#ecf5ea;border-color:#e4efe1}.sparkle-btn .sparkle-icon{font-size:17px;line-height:1}
/* Three-scene animated onboarding */

.welcome-controls{display:flex;gap:7px}.welcome-link{border:1px solid #e5ffd333;background:#ffffff0c;color:#e4f3da;font-size:11px;padding:7px 10px;border-radius:12px;font-weight:750}

.earth-orbit{position:absolute;left:50%;top:50%;width:min(87%,253px);aspect-ratio:1;border:1px solid #e5f7d94d;border-radius:50%;animation:ccOrbit 18s linear infinite}
.earth-orbit.orbit-two{width:min(69%,206px);border-style:dashed;border-color:#ecf7d536;animation-direction:reverse;animation-duration:27s}

.earth-planet svg{width:100%;height:100%;overflow:visible}

function wxFx(w){
  const many=(n,f)=>Array.from({length:n},(_,i)=>f(i)).join('');
  const cloud=(l,t,sc,o,d)=>`<span class="cloud" style="left:${l}%;top:${t}px;scale:${sc};opacity:${o};animation-delay:-${d}s"></span>`;
  if(w==='sunny')return `<span class="sun"></span>${cloud(42,62,.7,.7,2)}`;
  if(w==='cloudy')return cloud(60,62,1.05,.95,0)+cloud(38,84,.8,.7,3)+cloud(80,92,.65,.6,5);
  if(w==='rain')return cloud(58,60,1.05,.8,0)+cloud(80,84,.75,.6,3)+many(16,i=>`<i class="drop" style="left:${(i*37+5)%100}%;animation-delay:-${(i*.137)%1}s;animation-duration:${.8+(i%4)*.12}s"></i>`);
  if(w==='snow')return cloud(60,60,1,.9,0)+many(16,i=>`<i class="flake" style="left:${(i*29+3)%100}%;animation-delay:-${(i*.61)%5}s;animation-duration:${4+(i%5)*.7}s;scale:${.6+(i%3)*.3}"></i>`);
  return cloud(62,62,.95,.8,0)+many(5,i=>`<i class="gust" style="top:${52+i*24}px;animation-delay:-${i*.5}s;width:${70+i*14}px"></i>`);
}

function topbar(){return `<div class="topbar"><div class="mini-brand"><span class="brand-mark">${ico('leaf')}</span>ClimateConnect</div><div class="top-actions"><button class="icon-btn sparkle-btn" data-action="replay-intro" aria-label="${state.lang==='en'?'Replay animation':'重播欢迎动画'}" title="${state.lang==='en'?'Replay animation':'重播欢迎动画'}"><span class="sparkle-icon">✦</span></button><button class="icon-btn" data-action="lang" aria-label="Change language">${ico('globe')} ${state.lang==='en'?'中':'EN'}</button></div></div>`}
function explore(){let filt=facts.filter(f=>state.topic==='All'||f.cat===state.topic);return `${topbar()}<h1 class="heading">${tr('hello')}</h1><p class="subheading">${tr('intro')}</p>${weatherCard()}${hero()}<div class="section-title"><h3>${tr('facts')}</h3><button class="icon-btn" data-action="show-why" aria-label="How do we verify?">${ico('info')}</button></div><div class="chiprow">${['All','Climate','Evidence','Action'].map(c=>`<button class="chip ${state.topic===c?'active':''}" data-action="topic" data-id="${c}">${tr(c.toLowerCase())}</button>`).join('')}</div><div class="article-grid">${filt.map(f=>`<button class="article-card" data-action="open-fact" data-id="${f.id}"><div class="article-art" style="background:${f.bg};font-size:36px">${f.emoji}</div><span class="article-tag">${tr(f.cat.toLowerCase())}</span><h4>${loc(f.title)}</h4><div class="article-source"><strong>${f.source}</strong><span>${ico('arrow')}</span></div></button>`).join('')}</div><div class="section-title"><h3>${tr('quiz')}</h3><span>+10 pts</span></div><div class="prompt-card"><div class="panel-title" style="font-size:13px">${tr('question')}</div>${['q1','q2','q3'].map((q)=>`<button class="answer ${state.quiz===q?'selected '+(q==='q2'?'good':'bad'):''}" data-action="quiz" data-id="${q}">${tr(q)}</button>`).join('')}${state.quiz?`<div class="quiz-result">${tr(state.quiz==='q2'?'correct':'wrong')}</div>`:`<p class="hint">${tr('select')}</p>`}<button style="border:0;background:none;padding:7px 0 0;color:#39805a;font-size:11px;font-weight:800" data-action="open-fact" data-id="warming">${tr('readMore')} ↗</button></div>`}
function feedbackPage(){return `${topbar()}<span class="eyebrow">COMMUNICATION & TRUST</span><h1 class="heading" style="margin-top:10px">${tr('feedbackTitle')}</h1><p class="subheading">${tr('feedbackSub')}</p><div class="panel"><div class="panel-title">01 · ${tr('rate')}</div><div class="rating-row">${[1,2,3,4,5].map(n=>`<button class="rate-btn ${state.rating===n?'active':''}" data-action="rate" data-id="${n}" aria-label="${n} of 5">${n}</button>`).join('')}</div><p style="font-size:10px;margin-bottom:0">1 = ${state.lang==='en'?'not clear':'不清晰'} · 5 = ${state.lang==='en'?'very clear':'非常清晰'}</p></div><div class="panel"><div class="panel-title">02 · ${tr('helpful')}</div><div class="pill-group" style="margin-top:13px">${['yes','partly','no'].map(n=>`<button class="pill-choice ${state.helpful===n?'active':''}" data-action="helpful" data-id="${n}">${tr(n)}</button>`).join('')}</div><label class="field-label" for="category">03 · ${tr('category')}</label><select class="field select" id="category" data-field="category"><option value="Clarity" ${state.category==='Clarity'?'selected':''}>${state.lang==='en'?'Clarity':'清晰度'}</option><option value="Evidence" ${state.category==='Evidence'?'selected':''}>${state.lang==='en'?'Evidence & sources':'证据和来源'}</option><option value="Accessibility" ${state.category==='Accessibility'?'selected':''}>${state.lang==='en'?'Accessibility':'易用性'}</option><option value="Other" ${state.category==='Other'?'selected':''}>${state.lang==='en'?'Other':'其他'}</option></select><label class="field-label" for="comment">${tr('comment')}</label><textarea class="field" id="comment" data-field="message" maxlength="500" placeholder="${tr('placeholder')}">${esc(state.message)}</textarea><button class="btn-solid" style="margin-top:14px" data-action="submit">${tr('submit')} ${ico('arrow')}</button><p class="feedback-note">🔒 ${tr('note')}</p></div><div class="section-title"><h3>${tr('entries')}</h3><span>${state.feedback.length}</span></div>${state.feedback.length?state.feedback.slice(0,5).map(f=>`<div class="feedback-item"><strong>⭐ ${f.rating}/5 · ${esc(f.category)}</strong><p>${esc(f.message|| (state.lang==='en'?'No additional comment.':'无补充评论'))}</p><small>${esc(f.date)}</small></div>`).join(''):`<div class="empty">${tr('empty')}</div>`}`}
function challengePage(){let pts=points(),c=state.completed.length;return `${topbar()}<span class="eyebrow">GAMIFIED ACTION</span><h1 class="heading" style="margin-top:10px">${tr('challengeTitle')}</h1><p class="subheading">${tr('challengeSub')}</p><div class="score-summary"><small>✦ ${tr('yourImpact')}</small><strong>${pts} <span style="font-size:13px;letter-spacing:0;font-weight:500">pts</span></strong><p>${c}/${tasks.length} ${tr('done')}</p><div class="progress-bar" style="margin-top:15px;background:#ffffff35"><div style="width:${Math.round(c/tasks.length*100)}%"></div></div></div><div class="section-title"><h3>${tr('yourChallenges')}</h3><span>${c}/${tasks.length}</span></div>${tasks.map(t=>`<div class="challenge ${state.completed.includes(t.id)?'done':''}"><div class="challenge-icon">${t.emoji}</div><div class="challenge-copy"><h4>${loc(t.title)}</h4><p>${loc(t.desc)}</p><div class="challenge-bottom"><span class="points">+${t.pts} PTS</span><button class="complete-btn ${state.completed.includes(t.id)?'done':''}" data-action="complete" data-id="${t.id}">${state.completed.includes(t.id)?'✓ '+tr('completed'):tr('complete')}</button></div></div></div>`).join('')}<div class="section-title"><h3>${tr('reward')}</h3></div><div class="medals">${[[15,'🌱','first'],[35,'🌿','starter'],[65,'🏆','champion']].map(([v,e,k])=>`<div class="medal ${pts>=v?'unlocked':''}"><b>${e}</b><span>${tr(k)}<br>${v} pts</span></div>`).join('')}</div><p class="feedback-note" style="margin:15px 0">${tr('demo')}</p>`}
function modal(){let m=state.modal;if(!m)return '';if(m.type==='weather')return weatherSheet();if(m.type==='fact'){let f=facts.find(x=>x.id===m.id);return `<div class="modal-backdrop" data-action="close-modal"><section class="sheet" role="dialog" aria-modal="true" aria-label="${esc(loc(f.title))}"><div class="handle"></div><button class="close-btn" data-action="close-modal" aria-label="Close">${ico('x')}</button><div style="font-size:48px;margin:15px 0 6px">${f.emoji}</div><span class="eyebrow">${tr('summary')}</span><h2>${loc(f.title)}</h2><p>${loc(f.sub)}</p><div class="source-box"><b>${ico('shield')} ${tr('verified')}: ${f.source}</b>${state.lang==='en'?'View the original scientific report to check the full context.':'查看科学机构原始报告，核对完整上下文。'}<p style="margin-bottom:0"><a href="${f.url}" target="_blank" rel="noopener noreferrer">${tr('viewSource')} ↗</a></p></div><button class="btn-solid" data-action="go-challenges">${tr('join')} ${ico('arrow')}</button></section></div>`}return `<div class="modal-backdrop" data-action="close-modal"><section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div><button class="close-btn" data-action="close-modal" aria-label="Close">${ico('x')}</button><h2>${tr('whyTrust')}</h2><p>${tr('whyText')}</p><div class="source-box"><a href="https://science.nasa.gov/climate-change/evidence/" target="_blank" rel="noopener noreferrer">NASA Climate Evidence ↗</a><br><a href="https://www.ipcc.ch/report/ar6/syr/summary-for-policymakers/" target="_blank" rel="noopener noreferrer">IPCC AR6 Summary ↗</a></div></section></div>`}

function welcome(){
  if(!state.onboarding)return '';
  const en=state.lang==='en';
  const slides=en?[
    {eyebrow:'01 / 03 · DISCOVER',title:'Small steps.<br><span>Big understanding.</span>',desc:'Explore bite-sized climate facts and check the original sources behind each claim.',a:'📖',b:'✦'},
    {eyebrow:'02 / 03 · BUILD TRUST',title:'Real evidence.<br><span>Real confidence.</span>',desc:'Check where each claim comes from, ask questions, and share what matters to you.',a:'🛡️',b:'💬'},
    {eyebrow:'03 / 03 · TAKE ACTION',title:'Your actions.<br><span>A greener future.</span>',desc:'Join everyday climate challenges, earn points, and celebrate your progress.',a:'🌱',b:'🏆'}
  ]:[
    {eyebrow:'01 / 03 · 探索',title:'从一点知识开始<br><span>理解气候变化</span>',desc:'阅读简单易懂的气候知识，并随时查看信息背后的可信来源。',a:'📖',b:'✦'},
    {eyebrow:'02 / 03 · 建立信任',title:'真实的证据<br><span>值得信赖</span>',desc:'查看每条主张的来源，提出问题，分享你真正关心的事情。',a:'🛡️',b:'💬'},
    {eyebrow:'03 / 03 · 采取行动',title:'从你的行动开始<br><span>改变未来</span>',desc:'参加日常环保任务，积累积分，庆祝每一点进步。',a:'🌱',b:'🏆'}
  ];
  const slide=slides[state.introStep];
  return `<section class="welcome-overlay" role="dialog" aria-modal="true" aria-label="${en?'Welcome to ClimateConnect':'欢迎使用 ClimateConnect'}">
    <div class="welcome-heading"><div class="welcome-brand"><span class="welcome-brand-mark">${ico('leaf')}</span>ClimateConnect</div><div class="welcome-controls"><button class="welcome-link" data-action="lang" aria-label="Change language">${en?'中文':'EN'}</button><button class="welcome-link" data-action="intro-skip">${en?'Skip':'跳过'}</button></div></div>
    <div class="welcome-art" aria-hidden="true">
      <div class="earth-halo"></div><div class="earth-orbit"></div><div class="earth-orbit orbit-two"></div>
      <div class="earth-planet"><svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Planet Earth"><defs><clipPath id="earthClip"><circle cx="100" cy="100" r="91"/></clipPath><radialGradient id="earthFill" cx=".25" cy=".2" r=".9"><stop stop-color="#b7e3bc"/><stop offset=".58" stop-color="#61b5a2"/><stop offset="1" stop-color="#2c827a"/></radialGradient></defs><circle cx="100" cy="100" r="96" fill="#d7f1b1" opacity=".15"/><circle cx="100" cy="100" r="91" fill="url(#earthFill)"/><g clip-path="url(#earthClip)" fill="#d5edaf"><path d="M17 68c14-7 22-26 39-24 15 2 13 13 31 16 18 3 17 14 11 25l-14 8-5 19-19 10-14-13-21-8-13-17Z"/><path d="M75 119c18-12 40-4 50 9l-4 19-14 22-3 25-22-9-7-24-15-18Z"/><path d="M120 33c18-8 45 4 54 19l-5 12-23 5-7 15-14-7-16-20Z"/><path d="M143 100c12-17 42-12 55-2l-12 25-20 3-8 20-17-2-13-21Z"/><path d="M138 168c11-10 30-9 44-4l-12 22-26 9Z"/></g><circle cx="100" cy="100" r="91" fill="none" stroke="#e6f7d6" stroke-width="3" opacity=".62"/><path d="M36 121c38 26 92 33 138 3" fill="none" stroke="#e6ffdb" opacity=".25" stroke-width="2"/><ellipse cx="100" cy="101" rx="89" ry="30" transform="rotate(-20 100 101)" stroke="#ebf8db" opacity=".34" stroke-width="2" fill="none"/></svg></div>
      <div class="earth-spark one">${slide.a}</div><div class="earth-spark two">${slide.b}</div><span class="earth-twinkle one"></span><span class="earth-twinkle two"></span>
    </div>
    <div class="welcome-copy"><div class="welcome-number">${slide.eyebrow}</div><h2>${slide.title}</h2><p>${slide.desc}</p></div>
    <div class="welcome-bottom"><div class="welcome-dots">${slides.map((_,i)=>`<span class="welcome-dot ${i===state.introStep?'active':''}"></span>`).join('')}</div><button class="welcome-next" data-action="intro-next">${state.introStep===2?(en?"Let's explore":"开始探索"):(en?'Continue':'继续')} <span>→</span></button><div class="welcome-under">${en?'A little knowledge can create big change.':'用知识建立信任，让行动改变未来。'}</div></div>
  </section>`;
}
function finishWelcome(){
  state.onboarding=false;state.introStep=0;
  try{sessionStorage.setItem('cc-intro-seen-animated-v1','yes')}catch(e){}
  render();const el=document.getElementById('scroll');if(el)el.classList.add('page-enter-right');
}
let celebrationTimeout=0;
function celebrate(kind,value=0,badge=''){
  const screen=document.querySelector('.screen');if(!screen)return;
  const existing=screen.querySelector('.celebration-layer');if(existing)existing.remove();
  const en=state.lang==='en';const feedback=kind==='feedback';
  const newBadge=badge!=='';const emoji=feedback?'💬':newBadge?'🏆':'🌿';
  const title=feedback?(en?'Thank you!':'感谢你的反馈！'):newBadge?(en?'Badge unlocked!':'解锁新徽章！'):(en?'Great job!':'太棒了！');
  const description=feedback?(en?'Your feedback is saved in this demo. Thanks for helping us improve!':'你的反馈已保存在演示版本中，感谢帮助我们改进！'):newBadge?(en?`You just reached ${badge} points. Keep the momentum going!`:`你已经达到 ${badge} 积分，继续加油！`):(en?`+${value} points added to your impact score.`:`环保影响力积分 +${value}！`);
  const colors=['#c9efa2','#ebf5ce','#f7c68f','#7fd4ba','#ffffff'];
  const confetti=Array.from({length:28},(_,i)=>{
    const angle=(i/28)*Math.PI*2;const dist=105+(i*19)%150;
    const dx=Math.round(Math.cos(angle)*dist),dy=Math.round(Math.sin(angle)*dist);
    return `<span class="confetti-piece" style="--tx:${dx}px;--ty:${dy}px;--spin:${(i%2?1:-1)*(240+i*11)}deg;--delay:${(i*31)%230}ms;--color:${colors[i%colors.length]}"></span>`;
  }).join('');
  const layer=document.createElement('div');layer.className='celebration-layer';layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-label',title);
  layer.innerHTML=`${confetti}<div class="celebration-panel"><div class="celebration-emblem">${emoji}</div><div class="celebration-kicker">${feedback?'FEEDBACK':newBadge?'NEW ACHIEVEMENT':'CLIMATE ACTION'}</div><h2>${title}</h2><p>${description}</p><button class="celebration-close" data-action="close-celebration">${en?'Continue exploring':'继续探索'} →</button></div>`;
  screen.appendChild(layer);clearTimeout(celebrationTimeout);
  celebrationTimeout=setTimeout(()=>{if(layer.isConnected)layer.remove()},4200);
}

function nav(){return `<nav class="nav" aria-label="Main navigation">${[['explore','book'],['feedback','chat'],['challenges','award']].map(([k,ic])=>`<button class="nav-btn ${state.tab===k?'active':''}" data-action="nav" data-id="${k}" aria-current="${state.tab===k?'page':'false'}"><span class="nav-icon">${ico(ic)}</span>${tr(k)}</button>`).join('')}</nav>`}
function render(){let sc=document.getElementById('scroll');let prevScroll=sc?sc.scrollTop:0;document.documentElement.lang=state.lang;document.getElementById('app').innerHTML=`<main class="stage"><aside class="showcase"><div class="logo-row"><span class="brand-mark">${ico('leaf')}</span><span class="brand-name">ClimateConnect</span></div><span class="eyebrow">ANIMATED INTERACTIVE PROTOTYPE</span><h1>Build trust.<br><span>Inspire climate action.</span></h1><p>An animated learning journey with verified climate facts, two-way feedback and rewarding everyday actions.</p><div class="features"><div class="feature"><i>${ico('book')}</i> Explore source-linked climate facts</div><div class="feature"><i>${ico('chat')}</i> Give feedback in a two-way design concept</div><div class="feature"><i>${ico('award')}</i> Complete challenges and earn demo rewards</div></div><p class="showcase-note">CLASSROOM DEMO · Tap ✦ in the app header to replay the intro animation. Sample data stays on this device.</p></aside><div class="phone-wrap"><section class="phone" aria-label="ClimateConnect mobile prototype"><div class="screen"><div class="statusbar"><span>9:41</span><span class="status-icons">${ico('globe')} ● ▰</span></div><div class="scroll-view" id="scroll">${state.tab==='explore'?explore():state.tab==='feedback'?feedbackPage():challengePage()}<div style="height:20px"></div></div>${nav()}<div id="toast" class="toast" role="status"></div>${modal()}${welcome()}</div></section></div></main><footer class="site-footer">ClimateConnect is an independent class prototype, not affiliated with NASA or IPCC. External links require internet access. <button data-action="reset" style="border:none;background:transparent;color:#568369;text-decoration:underline;cursor:pointer">Reset demo</button></footer>`;document.getElementById('scroll').scrollTop=prevScroll;const mk=state.modal?state.modal.type:'';if(mk&&mk===lastModalKey)document.querySelector('.modal-backdrop')?.classList.add('still');lastModalKey=mk}
let lastModalKey='';
let resetAsk=0;let toastTimer=0;function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2500)}
let isNavigating=false;
function navigate(k){
  if(isNavigating)return;
  if(state.tab===k&&!state.modal)return;
  const order=['explore','feedback','challenges'];const direction=order.indexOf(k)>=order.indexOf(state.tab)?'right':'left';
  const sc=document.getElementById('scroll');
  const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced||!sc){state.tab=k;state.modal=null;render();document.getElementById('scroll').scrollTop=0;return}
  isNavigating=true;sc.classList.add(direction==='right'?'page-out-left':'page-out-right');
  setTimeout(()=>{
    state.tab=k;state.modal=null;render();
    const current=document.getElementById('scroll');current.scrollTop=0;
    current.classList.add(direction==='right'?'page-enter-right':'page-enter-left');
    current.addEventListener('animationend',e=>{if(e.target===current)current.classList.remove('page-enter-right','page-enter-left')});
    isNavigating=false;
  },165);
}

document.addEventListener('input',e=>{let k=e.target?.dataset?.field;if(k)state[k]=e.target.value});
document.addEventListener('change',e=>{let k=e.target?.dataset?.field;if(k)state[k]=e.target.value});
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(!el)return;let a=el.dataset.action,id=el.dataset.id;if(a==='close-modal'&&e.target!==el&&el.classList.contains('modal-backdrop'))return;if(a==='close-celebration'){el.closest('.celebration-layer')?.remove();return}
if(a==='intro-next'){if(state.introStep>=2)finishWelcome();else{state.introStep++;render()}return}
if(a==='intro-skip'){finishWelcome();return}
if(a==='replay-intro'){state.onboarding=true;state.introStep=0;render();return}
if(a==='weather'){state.weather=id;save();render();wkDo('change',650);wkConvo(CONVO[id][0]);return}
if(a==='open-weather'){state.modal={type:'weather'};render();return}
if(a==='walk-to'){const r=el.getBoundingClientRect();wkT=e.clientX-r.left-28;wkRun=Math.abs(wkT-wkX)>90;if(wkAct){document.getElementById('walker')?.classList.remove('act-'+wkAct);wkAct=''}return}
if(a==='poke'){const acts=['jump','spin','wave'];wkDo(acts[wkPoke%3],wkPoke%3===2?1500:700);const c=CONVO[state.weather];wkConvo(c[wkPoke%c.length]);wkPoke++;return}
if(a==='poke-pal'){palFlyEnd=performance.now()+1200;wkConvo([BIRDSAY[palPoke++%BIRDSAY.length]]);return}
if(a==='nav')return navigate(id);if(a==='lang'){state.lang=state.lang==='en'?'zh':'en';save();render();return}if(a==='topic'){state.topic=id;render();return}if(a==='open-fact'){state.modal={type:'fact',id};render();return}if(a==='show-why'){state.modal={type:'why'};render();return}if(a==='close-modal'){state.modal=null;render();return}if(a==='go-challenges')return navigate('challenges');if(a==='rate'){state.rating=+id;render();return}if(a==='helpful'){state.helpful=id;render();return}if(a==='quiz'){if(state.quiz==='q2'){toast(state.lang==='en'?'Quiz already completed!':'答题积分已领取！');return}state.quiz=id;save();render();if(id==='q2')celebrate('points',10);return}if(a==='complete'){
const before=points();const wasDone=state.completed.includes(id);
state.completed=wasDone?state.completed.filter(x=>x!==id):[...state.completed,id];save();render();
if(!wasDone){const delta=points()-before;const unlocked=[15,35,65].find(v=>before<v&&points()>=v);celebrate('points',delta,unlocked===undefined?'':unlocked)}
else toast(state.lang==='en'?'Challenge marked incomplete.':'已取消完成。');return} if(a==='submit'){if(!state.rating){toast(tr('rateNeeded'));return}if(!state.helpful){toast(tr('voteNeeded'));return}state.feedback.unshift({rating:state.rating,helpful:state.helpful,category:state.category,message:state.message.trim().slice(0,500),date:new Date().toLocaleDateString(state.lang==='en'?'en-GB':'zh-CN')});state.rating=0;state.helpful='';state.message='';save();render();celebrate('feedback');return}if(a==='reset'){if(Date.now()-resetAsk>4000){resetAsk=Date.now();toast(state.lang==='en'?'Tap Reset demo again to confirm.':'再点一次“Reset demo”确认重置。');return}{resetAsk=0;try{localStorage.removeItem(SKEY)}catch(err){}state.completed=[];state.feedback=[];state.quiz='';state.rating=0;state.helpful='';state.message='';render();toast(tr('resetDone'))}}});
render();
requestAnimationFrame(wkTick);
})();
</script>
