/* Motion system — animated ClimateConnect classroom prototype */
:root{--motion:cubic-bezier(.22,1,.36,1)}
@keyframes ccPageOutLeft{to{opacity:0;transform:translate3d(-17px,0,0) scale(.985);filter:blur(2px)}}
@keyframes ccPageOutRight{to{opacity:0;transform:translate3d(17px,0,0) scale(.985);filter:blur(2px)}}
@keyframes ccPageInRight{from{opacity:0;transform:translate3d(24px,8px,0) scale(.98);filter:blur(4px)}to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
@keyframes ccPageInLeft{from{opacity:0;transform:translate3d(-24px,8px,0) scale(.98);filter:blur(4px)}to{opacity:1;transform:translate3d(0,0,0) scale(1);filter:blur(0)}}
@keyframes ccContentIn{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}
@keyframes ccFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-11px) rotate(2deg)}}
@keyframes ccBreathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:1}}
@keyframes ccOrbit{from{transform:translate(-50%,-50%) rotate(0)}to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ccSpinSlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes ccWelcomeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes ccGlassIn{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ccPop{0%{transform:scale(.45);opacity:0}65%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ccParticle{0%{opacity:0;transform:translate(0,0) rotate(0) scale(.2)}18%{opacity:1}100%{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--spin)) scale(.75)}}
@keyframes ccShield{0%,100%{box-shadow:0 0 0 0 #c1eac630}50%{box-shadow:0 0 0 15px #c1eac600}}
@keyframes ccProgress{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.scroll-view{transform-origin:50% 40%;will-change:transform,opacity}
.scroll-view.page-out-left{animation:ccPageOutLeft .17s ease-in both;pointer-events:none}
.scroll-view.page-out-right{animation:ccPageOutRight .17s ease-in both;pointer-events:none}
.scroll-view.page-enter-right{animation:ccPageInRight .5s var(--motion) both}
.scroll-view.page-enter-left{animation:ccPageInLeft .5s var(--motion) both}
.scroll-view.page-enter-right > :nth-child(-n+7),.scroll-view.page-enter-left > :nth-child(-n+7){animation:ccContentIn .47s var(--motion) both}
.scroll-view.page-enter-right > :nth-child(2),.scroll-view.page-enter-left > :nth-child(2){animation-delay:.045s}
.scroll-view.page-enter-right > :nth-child(3),.scroll-view.page-enter-left > :nth-child(3){animation-delay:.08s}
.scroll-view.page-enter-right > :nth-child(4),.scroll-view.page-enter-left > :nth-child(4){animation-delay:.12s}
.scroll-view.page-enter-right > :nth-child(5),.scroll-view.page-enter-left > :nth-child(5){animation-delay:.16s}
.scroll-view.page-enter-right > :nth-child(6),.scroll-view.page-enter-left > :nth-child(6){animation-delay:.19s}
.hero-art{animation:ccFloat 5.2s ease-in-out infinite;transform-origin:60% 80%}
.hero::before{content:'✦';position:absolute;right:18%;top:23px;font-size:16px;color:#69a5808c;animation:ccBreathe 3s ease-in-out infinite}
.score-summary::after{animation:ccFloat 6s ease-in-out infinite}
.progress-bar > div{transform-origin:left;animation:ccProgress .75s var(--motion) both}
.nav-btn.active .nav-icon{animation:ccPop .36s var(--motion) both}
.nav-btn:active,.icon-btn:active,.btn-solid:active,.btn-outline:active,.hero-btn:active,.complete-btn:active{transform:scale(.94)}
.nav-btn,.btn-solid,.btn-outline,.hero-btn,.complete-btn,.article-card,.icon-btn{transition:transform .2s var(--motion),box-shadow .24s ease,background .2s ease}
@media(hover:hover){.article-card:hover,.challenge:hover{transform:translateY(-3px);box-shadow:0 12px 22px #2e77511c}.hero-btn:hover,.btn-solid:hover{box-shadow:0 10px 22px #25634a45;transform:translateY(-2px)}.icon-btn:hover{background:#edf6ed}}
.sheet{animation:ccGlassIn .33s var(--motion) both}.modal-backdrop{animation:ccWelcomeIn .2s ease both}
.top-actions{display:flex;align-items:center;gap:6px}.sparkle-btn{color:#2d8060;background:#ecf5ea;border-color:#e4efe1}.sparkle-btn .sparkle-icon{font-size:17px;line-height:1}
/* Three-scene animated onboarding */

.welcome-controls{display:flex;gap:7px}.welcome-link{border:1px solid #e5ffd333;background:#ffffff0c;color:#e4f3da;font-size:11px;padding:7px 10px;border-radius:12px;font-weight:750}

.earth-orbit{position:absolute;left:50%;top:50%;width:min(87%,253px);aspect-ratio:1;border:1px solid #e5f7d94d;border-radius:50%;animation:ccOrbit 18s linear infinite}
.earth-orbit.orbit-two{width:min(69%,206px);border-style:dashed;border-color:#ecf7d536;animation-direction:reverse;animation-duration:27s}

.earth-planet svg{width:100%;height:100%;overflow:visible}
.earth-spark{position:absolute;z-index:3;display:grid;place-items:center;border-radius:18px;box-shadow:0 7px 20px #09251e52;background:#f4f9e7;color:#24573f;font-size:23px;width:52px;height:52px;animation:ccFloat 4.4s ease-in-out infinite}
.earth-spark.one{left:6%;top:19%;transform:rotate(-14deg)}.earth-spark.two{right:3%;bottom:20%;width:58px;height:58px;background:#d5edb4;animation-delay:-2s}
.earth-twinkle{position:absolute;width:7px;height:7px;border-radius:50%;background:#def2bc;box-shadow:0 0 16px #bcec99;animation:ccBreathe 2s ease-in-out infinite}.earth-twinkle.one{top:21%;right:22%}.earth-twinkle.two{bottom:22%;left:18%;animation-delay:.7s}
.welcome-copy{position:relative;z-index:2;animation:ccWelcomeIn .45s var(--motion) both;min-height:164px}
.welcome-number{font-size:11px;letter-spacing:2px;font-weight:850;color:#b5dda9}
.welcome-copy h2{font-size:clamp(26px,4vh,34px);letter-spacing:-1.3px;line-height:1.12;margin:12px 0 11px;font-weight:850}
.welcome-copy h2 span{color:#c6efa9}
.welcome-copy p{font-size:12.5px;line-height:1.7;color:#d1e4d4;max-width:300px;margin:0}
.welcome-bottom{position:relative;z-index:2;margin-top:auto;padding-top:13px}
.welcome-dots{display:flex;gap:7px;margin:0 0 17px}.welcome-dot{width:7px;height:7px;border-radius:20px;background:#f4f7df62;transition:width .35s var(--motion),background .35s}.welcome-dot.active{width:26px;background:#c5ec9e}
.welcome-next{width:100%;border:0;background:#d6efad;color:#245440;min-height:51px;border-radius:17px;font-size:13px;font-weight:850;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 14px 25px #0d251f35;transition:transform .2s var(--motion),box-shadow .2s}
.welcome-next:active{transform:scale(.96)}.welcome-next:hover{box-shadow:0 15px 30px #0d251f60}.welcome-next span{font-size:18px}
.welcome-under{font-size:10px;margin-top:12px;text-align:center;color:#bad6c1}
/* Confetti reward animations, not just a toast */
.celebration-layer{position:absolute;z-index:60;inset:0;display:grid;place-items:center;overflow:hidden;background:#0e3329ba;backdrop-filter:blur(4px);animation:ccWelcomeIn .17s ease both;cursor:pointer}
.celebration-panel{position:relative;z-index:3;margin:0 25px;background:linear-gradient(155deg,#fcfff7,#e9f5e6);border:1px solid #d5ead2;border-radius:28px;padding:28px 21px 26px;text-align:center;box-shadow:0 26px 70px #0b241b65;width:calc(100% - 50px);max-width:315px;animation:ccGlassIn .46s var(--motion) both}
.celebration-emblem{display:grid;place-items:center;border-radius:50%;width:80px;height:80px;margin:0 auto 10px;background:#daf0ce;font-size:42px;animation:ccPop .55s var(--motion) both,ccShield 2s ease-in-out infinite}
.celebration-kicker{color:#3c9061;font-weight:900;letter-spacing:2px;font-size:10px}
.celebration-panel h2{font-size:26px;letter-spacing:-1px;margin:9px 0;color:#1b573c}.celebration-panel p{font-size:12px;line-height:1.6;color:#668473;margin:0}
.celebration-close{margin-top:21px;background:#276d4c;border:0;color:white;font-size:12px;font-weight:800;border-radius:13px;padding:12px 25px}
.confetti-piece{position:absolute;left:50%;top:45%;z-index:1;display:block;width:9px;height:16px;border-radius:3px;background:var(--color);opacity:0;animation:ccParticle 1.4s ease-out var(--delay) forwards;pointer-events:none}
.confetti-piece:nth-child(3n){border-radius:50%;width:10px;height:10px}.confetti-piece:nth-child(4n){width:7px;height:22px}
@media(max-height:650px){.welcome-overlay{padding:18px 25px 16px}.welcome-art{min-height:115px;margin:5px 0 0}.welcome-copy{min-height:125px}.welcome-copy h2{font-size:26px;margin:8px 0}.welcome-copy p{font-size:11px}.welcome-dots{margin-bottom:10px}.welcome-next{min-height:43px}.welcome-under{margin-top:7px}}
@media(prefers-reduced-motion:reduce){.scroll-view{will-change:auto}.welcome-overlay,.celebration-layer{backdrop-filter:none}}

/* ===== Weather widget (added) ===== */
.wx{position:relative;height:194px;border-radius:25px;color:#fff;overflow:hidden;margin:0 0 14px;box-shadow:0 12px 26px #1b4a6a2b;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wx-fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wx-info{position:absolute;left:17px;top:13px;z-index:1}
.wx-loc{font-size:12px;font-weight:800;display:flex;gap:4px;align-items:center}
.wx-loc svg{width:13px;height:13px}
.wx-temp{font-size:44px;font-weight:300;line-height:1;letter-spacing:-1px;margin:2px 0 1px;font-variant-numeric:tabular-nums}
.wx-cond{font-size:11.5px;font-weight:750;opacity:.95;font-variant-numeric:tabular-nums}
.wx-pick{position:absolute;right:12px;top:12px;z-index:4;display:flex;gap:4px;background:#00000024;border-radius:20px;padding:3px}
.wx-pick button{width:26px;height:26px;border:0;border-radius:50%;background:transparent;color:#fff;display:grid;place-items:center;padding:0;transition:background .2s,transform .2s var(--motion)}
.wx-pick button svg{width:15px;height:15px}
.wx-pick button.on{background:#fff;color:#245b7a}
.wx-pick button:active{transform:scale(.88)}
.sheet .btn-solid svg{width:16px;height:16px;flex:none}
.wx-more{margin-left:6px;font-size:10px;font-weight:800;background:#ffffff2e;border:1px solid #ffffff3d;border-radius:20px;padding:3px 8px}
.scene{position:absolute;left:0;right:0;bottom:0;height:106px;z-index:2;cursor:pointer}
.ground-clip{position:absolute;left:0;right:0;bottom:0;height:31px;overflow:hidden}
.ground{position:absolute;left:-12%;right:-12%;top:0;height:70px;border-radius:50% 50% 0 0/100% 100% 0 0}
.walker{position:absolute;left:0;bottom:9px;width:56px;height:85px;border:0;background:none;padding:0;z-index:2;will-change:transform;--amp:26deg;--dur:.62s;--lean:3deg}
.walker.running{--amp:42deg;--dur:.36s;--lean:10deg}
.walker.against{--lean:13deg}
.walker .flip,.walker .bob{display:block;width:100%;height:100%}
.walker .flip{transition:transform .22s ease}
.walker svg{width:100%;height:100%;overflow:visible}
.walker .shadow{position:absolute;left:50%;bottom:-3px;width:34px;height:7px;margin-left:-17px;border-radius:50%;background:#0b2a1e38}
.walker g{transition:transform .25s ease}
.rig{transform-origin:23px 65px}
.legL{transform-origin:19.2px 44px}.shinL{transform-origin:19.2px 53px}
.legR{transform-origin:26.7px 44px}.shinR{transform-origin:26.7px 53px}
.armL{transform-origin:12.7px 28px}.foreL{transform-origin:12.7px 36px}
.armR{transform-origin:33.2px 28px}.foreR{transform-origin:33.2px 36px}
.head{transform-origin:23px 24px}.eyes{transform-origin:25.5px 15.5px;animation:wkBlink 4.2s infinite}
.hold{transform-origin:33px 30px}
.glint{animation:wkGlint 3s ease-in-out infinite}
.puff{opacity:0;transform-origin:35px 19px}
.scarf-tail{transform-origin:15px 26px;animation:wkFlutter .45s ease-in-out infinite alternate}
.walker:not(.moving) .head{animation:wkIdleHead 6s ease-in-out infinite}
.walker:not(.moving) .rig{animation:wkBreathe 2.6s ease-in-out infinite alternate}
.moving .legL{animation:wkThigh var(--dur) ease-in-out infinite}
.moving .legR{animation:wkThigh var(--dur) ease-in-out infinite;animation-delay:calc(var(--dur)/-2)}
.moving .shinL{animation:wkShin var(--dur) linear infinite}
.moving .shinR{animation:wkShin var(--dur) linear infinite;animation-delay:calc(var(--dur)/-2)}
.moving .armR{animation:wkArm var(--dur) ease-in-out infinite}
.moving .armL{animation:wkArm var(--dur) ease-in-out infinite;animation-delay:calc(var(--dur)/-2)}
.moving .fore{transform:rotate(-30deg)}
.running .fore{transform:rotate(-75deg)}
.moving .rig{animation:wkBob calc(var(--dur)/2) ease-in-out infinite alternate}
.moving .head{animation:wkNod calc(var(--dur)/2) ease-in-out infinite alternate}
.moving .hold{animation:wkUmb var(--dur) ease-in-out infinite!important}
.walker .hold{animation:none}
/* one-off actions */
.act-jump .rig{animation:wkJump .7s var(--motion)!important}
.act-jump .shadow{animation:wkShadow .7s var(--motion)}
.act-jump .free,.act-jump .armL{animation:none!important;transform:rotate(-165deg)}
.act-spin .bob{animation:wkSpin .7s var(--motion)}
.act-wave .free{animation:none!important;transform:rotate(-150deg)}
.act-wave .free .fore{animation:wkWave .28s ease-in-out infinite alternate}
.act-wave .head{animation:none!important;transform:rotate(6deg)}
.act-look .head{animation:none!important;transform:rotate(-18deg)}
.act-look .free{animation:none!important;transform:rotate(-125deg)}
.act-look .free .fore{transform:rotate(-80deg)}
.act-wipe .free{animation:none!important;transform:rotate(-118deg)}
.act-wipe .free .fore{animation:wkWipe .5s ease-in-out infinite alternate}
.act-shiver .rig{animation:wkShiver .1s linear infinite!important}
.act-shiver .armR,.act-shiver .armL{animation:none!important;transform:rotate(-38deg)}
.act-shiver .fore{transform:rotate(-105deg)}
.act-shiver .puff{animation:wkPuff 1s ease-out infinite}
.act-splash .rig{animation:wkJump .55s var(--motion) 2!important}
.act-splash .shadow{animation:wkShadow .55s var(--motion) 2}
.act-lean .rig{animation:none!important;transform:rotate(15deg)}
.act-lean .free{animation:none!important;transform:rotate(-140deg)}
.act-lean .free .fore{transform:rotate(-70deg)}
.act-lean .scarf-tail{animation-duration:.18s}
.act-change .bob{animation:wkPoof .65s var(--motion)}
.act-change::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;border:2px solid #fff;animation:wkRing .65s ease-out forwards;pointer-events:none}
.bubble{position:absolute;bottom:96px;left:0;max-width:190px;width:max-content;background:#fff;color:#193d32;font-size:10.5px;font-weight:750;line-height:1.4;padding:6px 9px;border-radius:13px 13px 13px 4px;box-shadow:0 8px 18px #0003;opacity:0;transform:translateY(6px) scale(.9);transform-origin:0 100%;transition:opacity .2s,transform .25s var(--motion);pointer-events:none;z-index:5}
.bubble.on{opacity:1;transform:none}
.fx-print{position:absolute;bottom:11px;width:7px;height:3px;border-radius:50%;background:#aebfd0;animation:wkFade 2.6s forwards;pointer-events:none}
.fx-ripple{position:absolute;bottom:9px;width:6px;height:3px;border:1px solid #ffffffd0;border-radius:50%;animation:wkRipple .7s ease-out forwards;pointer-events:none}
.fx-dust{position:absolute;bottom:11px;width:6px;height:6px;border-radius:50%;background:#ffffffa0;animation:wkDust .5s ease-out forwards;pointer-events:none}
.fx-splash{position:absolute;bottom:12px;width:3px;height:6px;border-radius:3px;background:#e4f2ff;animation:wkSplash .55s ease-out forwards;pointer-events:none}
.sun{position:absolute;right:26px;top:50px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#fff6c2,#ffd84d 62%);box-shadow:0 0 0 9px #ffe98a38,0 0 34px #ffe27a;animation:ccBreathe 4s ease-in-out infinite}
.cloud{position:absolute;width:64px;height:20px;border-radius:20px;background:#fff;animation:wkDrift 7s ease-in-out infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:26px;height:26px;left:10px;top:-12px}
.cloud::after{width:20px;height:20px;left:32px;top:-8px}
.drop{position:absolute;top:-12%;width:2px;height:12px;border-radius:2px;background:#ffffffb5;transform:rotate(12deg);animation:wkFall 1s linear infinite}
.flake{position:absolute;top:-6%;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.92;animation:wkSnow 5s linear infinite}
.gust{position:absolute;left:-30%;height:2px;width:90px;border-radius:2px;background:linear-gradient(90deg,transparent,#ffffffd0,transparent);animation:wkGust 2.2s linear infinite}
/* richer character + bird friend */
.pinwheel{transform-origin:39px 30px;animation:wkSpinZ .5s linear infinite}
.act-lean .pinwheel{animation-duration:.16s}
.hairblow{transform-origin:14px 10px;animation:wkFlutter .3s ease-in-out infinite alternate}
.note{opacity:0;animation:wkNote 2.4s ease-out infinite}
.note.n2{animation-delay:-1.2s}
.walker .mouth{opacity:0;transform-origin:25.2px 20.6px}
.walker.talking .mouth{opacity:1;animation:wkMouth .2s ease-in-out infinite alternate}
.walker.talking .smile{opacity:0}
.walker.talking:not(.moving) .free{transform:rotate(-55deg)}
.walker.talking:not(.moving) .free .fore{transform:rotate(-70deg)}
.pal{position:absolute;left:0;bottom:11px;width:30px;height:28px;border:0;background:none;padding:0;z-index:2;will-change:transform}
.pal .flip,.pal .pb{display:block;width:100%;height:100%}
.pal .flip{transition:transform .2s ease}
.pal svg{width:100%;height:100%;overflow:visible}
.pal .bhead{transform-origin:16px 14px}
.pal .wing{transform-origin:13px 12px}
.pal:not(.hop):not(.chirp) .bhead{animation:wkPeck 5s ease-in-out infinite}
.pal.hop .pb,.pal.chirp .pb{animation:wkHop .28s ease-in-out infinite}
.pal.hop .wing,.pal.fly .wing,.pal.chirp .wing{animation:wkFlap .1s linear infinite alternate}
.pal.chirp .bhead{transform:rotate(-14deg)}
.pal.fly .pb{animation:wkFly 1.2s var(--motion)!important}
.bubble.from-pal{background:#eaf7df}
.bubble.flipb{border-radius:13px 13px 4px 13px;transform-origin:100% 100%}
@keyframes wkSpinZ{to{transform:rotate(360deg)}}
@keyframes wkNote{0%{opacity:0;transform:translate(0,4px)}25%{opacity:1}100%{opacity:0;transform:translate(5px,-10px)}}
@keyframes wkMouth{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
@keyframes wkHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wkPeck{0%,70%,100%{transform:rotate(0)}76%,84%{transform:rotate(30deg)}80%{transform:rotate(12deg)}}
@keyframes wkFlap{from{transform:rotate(-38deg)}to{transform:rotate(26deg)}}
@keyframes wkFly{0%,100%{transform:translate(0,0)}30%{transform:translate(7px,-38px) rotate(-16deg)}62%{transform:translate(-9px,-46px) rotate(10deg)}}
/* detail sheet */
.wxd{clear:both;position:relative;border-radius:22px;color:#fff;overflow:hidden;padding:16px 14px 14px;margin:6px 0 12px}
.wxd-top{position:relative;z-index:1;padding:0 4px 6px}
.wxd .wx-temp{font-size:58px}
.wxd-pick{position:relative;z-index:1;display:flex;gap:6px;margin-top:8px}
.wxd-pick button{flex:1;min-width:0;border:1px solid #ffffff3d;background:#ffffff24;color:#fff;border-radius:13px;padding:7px 2px 6px;display:grid;justify-items:center;gap:3px;font-size:10px;font-weight:800}
.wxd-pick button svg{width:17px;height:17px}
.wxd-pick button.on{background:#fff;color:#245b7a}
.wxd-panel{position:relative;z-index:1;margin-top:10px;background:#0000002b;border-radius:15px;padding:10px 12px}
.wxd-cap{font-size:9.5px;font-weight:850;letter-spacing:1px;opacity:.8;margin-bottom:8px;text-transform:uppercase}
.wx-hours{display:flex;justify-content:space-between;text-align:center;font-size:10.5px;font-weight:700}
.wx-hours div{display:grid;gap:6px;justify-items:center}
.wx-hours svg,.wx-day svg{width:15px;height:15px}
.wx-hours b{font-size:12.5px;font-variant-numeric:tabular-nums}
.wx-day{display:grid;grid-template-columns:48px 18px 28px 1fr 28px;align-items:center;gap:8px;font-size:12px;font-weight:700;padding:6px 0;border-top:1px solid #ffffff24;font-variant-numeric:tabular-nums}
.wx-day:first-of-type{border-top:0}
.wx-day .lo{opacity:.72;text-align:right}
.wx-bar{height:5px;border-radius:5px;background:#00000033;position:relative}
.wx-bar i{position:absolute;top:0;bottom:0;border-radius:5px;background:linear-gradient(90deg,#9bdcff,#ffe27a,#ffa45c)}
.still,.still .sheet{animation:none!important}
@keyframes wkThigh{0%,100%{transform:rotate(calc(var(--amp)*-1))}50%{transform:rotate(var(--amp))}}
@keyframes wkShin{0%{transform:rotate(4deg)}50%{transform:rotate(16deg)}74%{transform:rotate(66deg)}100%{transform:rotate(4deg)}}
@keyframes wkArm{0%,100%{transform:rotate(calc(var(--amp)*-.8))}50%{transform:rotate(calc(var(--amp)*.8))}}
@keyframes wkBob{from{transform:translateY(.7px) rotate(var(--lean))}to{transform:translateY(-1.5px) rotate(var(--lean))}}
@keyframes wkNod{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
@keyframes wkUmb{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes wkBreathe{from{transform:scale(1,1)}to{transform:scale(1.015,.985)}}
@keyframes wkIdleHead{0%,55%,100%{transform:rotate(0)}65%,75%{transform:rotate(-10deg)}85%,92%{transform:rotate(7deg)}}
@keyframes wkBlink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wkGlint{0%,70%,100%{opacity:0}80%{opacity:1}}
@keyframes wkFlutter{from{transform:rotate(-8deg)}to{transform:rotate(12deg)}}
@keyframes wkJump{0%,100%{transform:none}14%{transform:translateY(2px) scale(1.14,.84)}46%{transform:translateY(-24px) scale(.93,1.09)}76%{transform:translateY(0) scale(1.1,.88)}}
@keyframes wkShadow{0%,100%{transform:scale(1);opacity:1}46%{transform:scale(.55);opacity:.5}}
@keyframes wkSpin{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes wkWave{from{transform:rotate(18deg)}to{transform:rotate(-38deg)}}
@keyframes wkWipe{from{transform:rotate(-80deg)}to{transform:rotate(-105deg)}}
@keyframes wkShiver{0%,100%{transform:translateX(-.9px)}50%{transform:translateX(.9px)}}
@keyframes wkPuff{0%{opacity:.85;transform:none}100%{opacity:0;transform:translate(7px,-4px) scale(2)}}
@keyframes wkPoof{0%{transform:scale(1) rotate(0)}40%{transform:scale(.08) rotate(200deg)}100%{transform:scale(1) rotate(360deg)}}
@keyframes wkRing{from{transform:scale(.5);opacity:1}to{transform:scale(6);opacity:0}}
@keyframes wkFade{0%{opacity:.9}100%{opacity:0}}
@keyframes wkRipple{from{transform:scale(.6);opacity:1}to{transform:scale(3.4,2.2);opacity:0}}
@keyframes wkDust{from{transform:none;opacity:.9}to{transform:translate(var(--dx),-9px) scale(2);opacity:0}}
@keyframes wkSplash{0%{transform:none;opacity:1}100%{transform:translate(var(--dx),-22px);opacity:0}}
@keyframes wkDrift{from{transform:translateX(-10px)}to{transform:translateX(14px)}}
@keyframes wkFall{to{top:104%}}
@keyframes wkSnow{to{top:104%;margin-left:18px}}
@keyframes wkGust{0%{left:-30%;opacity:0}20%{opacity:1}100%{left:110%;opacity:0}}

/* ===== v2: verification-first + two-way interaction ===== */
.claim{background:linear-gradient(155deg,#1f5a40,#163f2e);color:#f2f8ec;border-radius:24px;padding:18px 17px 16px;margin:14px 0 16px;box-shadow:0 14px 28px #163f2e33}
.source-box svg,.claim svg,.send-big svg,.two-actions svg,.discuss svg,.talk-hero svg{width:15px;height:15px;flex:none}
.claim .tag{display:inline-flex;gap:6px;align-items:center;font-size:9.5px;font-weight:850;letter-spacing:1.2px;color:#c9efa2;background:#ffffff17;border-radius:20px;padding:5px 9px}

.claim-actions a{background:transparent;color:#c9efa2}
.claim-actions button{background:#c9efa2;color:#163f2e}
.ctx-label{font-size:10px;font-weight:850;letter-spacing:1.3px;color:#7b9084;margin:20px 0 8px}
.scaffold{margin-top:12px;border-top:1px solid #eef1eb}
.sq{width:100%;border:0;background:none;padding:10px 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#24412f;text-align:left;border-bottom:1px solid #eef1eb}

.ba b{display:block;font-size:9.5px;letter-spacing:1.1px;margin-bottom:5px}
.illu{display:inline-block;font-size:9px;font-weight:850;letter-spacing:1.2px;color:#a2652f;background:#fbeee0;border-radius:6px;padding:3px 6px}
/* talk page */
.talk-hero{border-radius:24px;padding:18px;background:linear-gradient(150deg,#f7c68f,#f2a65a);color:#3a2412;margin:6px 0 14px;position:relative;overflow:hidden}
.talk-hero h1{font-size:25px;line-height:1.12;letter-spacing:-.8px;margin:6px 0 8px}
.talk-hero p{font-size:12px;line-height:1.55;margin:0;max-width:250px}
.talk-hero .loop{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:13px;font-size:9.5px;text-align:center;font-weight:850;flex-wrap:wrap}
.talk-hero .loop span{background:#ffffff8c;border-radius:10px;padding:6px 3px;line-height:1.25;counter-increment:lp}.talk-hero .loop{counter-reset:lp}.talk-hero .loop span::before{content:counter(lp) '. ';opacity:.6}
.step{display:flex;gap:9px;align-items:center;font-size:13px;font-weight:850;margin:16px 0 9px}
.step b{width:22px;height:22px;border-radius:50%;background:#276747;color:#fff;display:grid;place-items:center;font-size:11px;flex:none}
.claims{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px}
.claims::-webkit-scrollbar{display:none}
.cpick{flex:none;width:168px;text-align:left;border:1.5px solid #e2ebe0;background:#fff;border-radius:16px;padding:11px;font-size:11.5px;line-height:1.4;color:#24412f;font-weight:700}
.cpick small{display:block;margin-top:7px;font-size:10px;color:#7b9084;font-weight:800}
.cpick.on{border-color:#276747;background:#eef7e8;box-shadow:0 0 0 3px #27674722}
.trow{display:flex;align-items:center;gap:8px;margin-top:8px}
.trow>span{width:96px;font-size:11px;font-weight:800;color:#4c6856;flex:none}
.trow .pill-group{flex:1;display:flex;gap:5px;margin:0}
.trow .pill-choice{padding:8px 4px;font-size:10.5px}
.pill-choice.active{background:#276747!important;color:#fff!important;border-color:#276747!important}
.send-big{width:100%;border:0;margin-top:14px;border-radius:16px;padding:14px;font-size:13.5px;font-weight:850;background:#276747;color:#fff;display:flex;justify-content:center;gap:8px;align-items:center;box-shadow:0 10px 20px #27674733}
.send-big:disabled{background:#b9c8bd;box-shadow:none}
.thread{background:#fff;border:1px solid #e7ebe4;border-radius:20px;padding:13px;margin-bottom:10px}
.thread-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:850;color:#24412f;margin-bottom:9px}
.bub{max-width:88%;border-radius:15px;padding:9px 11px;font-size:11.5px;line-height:1.5;margin-bottom:7px}
.bub.me{margin-left:auto;background:#276747;color:#fff;border-bottom-right-radius:4px}
.bub.them{background:#f2f4ef;color:#24412f;border-bottom-left-radius:4px}
.bub small{display:block;font-size:9.5px;opacity:.75;margin-top:4px}
.status{display:flex;gap:4px;margin:4px 0 9px}
.status div{flex:1;text-align:center;font-size:9px;font-weight:800;color:#9aab9f}
.status div i{display:block;height:4px;border-radius:4px;background:#e2e8df;margin-bottom:4px}
.status div.ok{color:#276747}.status div.ok i{background:#276747}
.receipt{border:1.5px dashed #9fc59a;border-radius:18px;padding:14px;background:#f4faef;margin:10px 0}
.receipt .big{font-size:15px;font-weight:850;line-height:1.4;color:#1f3a2a;margin:6px 0 10px}
.receipt dl{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:11.5px;margin:0}
.receipt dt{color:#7b9084;font-weight:800}.receipt dd{margin:0;color:#24412f;overflow-wrap:anywhere}
.nav-btn.talk{position:relative;color:#fff!important}
.nav-btn.talk .nav-icon{background:#f2a65a!important;color:#3a2412!important;width:50px;height:50px;border-radius:18px;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 18px #f2a65a66;border:3px solid #fff}
.nav-btn.talk{color:#a2652f!important;font-weight:850}
.nav-btn.talk.active .nav-icon{background:#276747!important;color:#fff!important;box-shadow:0 8px 18px #27674755}
.nav-btn.talk.active{color:#276747!important}
.logrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eef1eb;font-size:12px}
.logrow b{font-variant-numeric:tabular-nums}
/* ===== forum ===== */
.seg2{display:flex;background:#eef2ea;border-radius:14px;padding:4px;gap:4px;margin:0 0 12px}
.seg2 button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px 6px;font-size:12px;font-weight:850;color:#5f7867;display:flex;gap:6px;justify-content:center;align-items:center}
.seg2 button.on{background:#fff;color:#24412f;box-shadow:0 3px 10px #24412f1a}
.seg2 svg{width:15px;height:15px}
.seg2 em{font-style:normal;background:#f2a65a;color:#3a2412;border-radius:10px;padding:1px 6px;font-size:10px}
.fbar{display:flex;gap:6px;align-items:center;margin-bottom:10px}
.fbar .chiprow{margin:0;flex:1}
.fsort{border:1px solid #e2ebe0;background:#fff;border-radius:20px;padding:7px 10px;font-size:10.5px;font-weight:800;color:#4c6856;white-space:nowrap}
.sample{font-size:10px;line-height:1.5;color:#8a6a45;background:#fbf3e8;border-radius:12px;padding:8px 10px;margin-bottom:10px}
.post{width:100%;text-align:left;background:#fff;border:1px solid #e7ebe4;border-radius:18px;padding:12px 13px;margin-bottom:9px;display:block;color:#24412f;transition:transform .2s,box-shadow .2s}
.post:hover{transform:translateY(-2px);box-shadow:0 10px 20px #24412f14}
.post-h{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#7b9084;font-weight:700}
.ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:850;color:#fff;flex:none}
.post h4{margin:8px 0 5px;font-size:13.5px;line-height:1.35;letter-spacing:-.2px}
.post p{margin:0;font-size:11.5px;line-height:1.5;color:#5f7867;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-f{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.ptag{font-size:10px;font-weight:850;color:#276747;background:#e8f3df;border-radius:20px;padding:3px 8px}
.pstat{font-size:10.5px;font-weight:800;color:#7b9084;display:inline-flex;gap:3px;align-items:center}
.pstat svg{width:12px;height:12px}
.solved{font-size:10px;font-weight:850;color:#a2652f;background:#fbeee0;border-radius:20px;padding:3px 8px}
.helpful{border:1px solid #dce8dd;background:#fff;border-radius:20px;padding:5px 10px;font-size:10.5px;font-weight:850;color:#4c6856;display:inline-flex;gap:4px;align-items:center}
.helpful.on{background:#276747;color:#fff;border-color:#276747}
.newpost{width:100%;border:1.5px dashed #9fc59a;background:#f4faef;border-radius:16px;padding:12px;font-size:12.5px;font-weight:850;color:#276747;margin-bottom:10px;display:flex;gap:7px;justify-content:center;align-items:center}
.newpost svg{width:15px;height:15px}
.rep{display:flex;gap:9px;padding:11px 0;border-top:1px solid #eef1eb}
.rep .body{flex:1;min-width:0}
.rep .who{font-size:10.5px;font-weight:850;color:#24412f}.rep .who span{color:#7b9084;font-weight:700}
.rep p{margin:4px 0 6px;font-size:12px;line-height:1.55;color:#3f5c4a;overflow-wrap:anywhere}
.rep.org{background:#fbf3e8;border-radius:14px;padding:11px;border:0;margin:6px 0}
.reply-box{display:flex;gap:7px;margin-top:10px;align-items:flex-end}
.reply-box textarea{flex:1;min-height:44px;margin:0}
.reply-box button{border:0;background:#276747;color:#fff;border-radius:12px;padding:11px 13px;font-size:12px;font-weight:850}
.to-fb{width:100%;margin-top:10px;border:1px solid #f2a65a;background:#fff7ee;color:#7a4317;border-radius:13px;padding:10px;font-size:11.5px;font-weight:850}
.discuss{display:inline-flex;gap:5px;align-items:center;margin-top:10px;border:0;background:none;color:#c9efa2;font-size:11px;font-weight:850;padding:0}
.discuss svg{width:13px;height:13px}
.lvl{display:inline-flex;align-items:center;gap:4px;background:#eef2ea;border-radius:12px;padding:3px;margin-top:10px}
.lvl span{font-size:10.5px;font-weight:850;color:#5f7867;padding:0 6px}
.lvl button{border:0;background:transparent;border-radius:9px;padding:6px 11px;font-size:11px;font-weight:850;color:#5f7867}
.lvl button.on{background:#276747;color:#fff}
.simple-line{font-size:11px;line-height:1.45;color:#5f7867;margin:2px 0 6px}
.vq{padding:10px 0;border-bottom:1px solid #eef1eb}.vq:last-of-type{border-bottom:0}
.vq-t{display:flex;gap:8px;font-size:12.5px;font-weight:800;color:#24412f;margin-bottom:8px;line-height:1.4}
.vq-t b{width:20px;height:20px;border-radius:50%;background:#276747;color:#fff;display:grid;place-items:center;font-size:10.5px;flex:none}
.vq .pill-group{display:flex;gap:6px}
.linkbtn{border:0;background:none;color:#276747;font-weight:850;font-size:11px;padding:0}

.verdict.good{background:#dcefd2;color:#1f4a31}.verdict.mid{background:#fbeccf;color:#6b4a1d}.verdict.bad{background:#f6dcd6;color:#7a2f22}

.news{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:1px solid #e7ebe4;border-radius:16px;padding:11px 12px;margin-bottom:8px}
.news-w{font-size:9px;font-weight:850;letter-spacing:1px;color:#a2652f;background:#fbeee0;border-radius:6px;padding:4px 6px;flex:none}
.news-t{flex:1;font-size:12px;font-weight:750;line-height:1.4;color:#24412f}
.news-go{font-size:11px;font-weight:850;color:#276747;white-space:nowrap}
.cmp{margin-top:12px;border-radius:16px;background:#f4f7f0;padding:12px;animation:ccFadeUp .25s both}
.cmp.none{font-size:11.5px;color:#5f7867;line-height:1.5}
.cmp-h{font-size:9.5px;font-weight:850;letter-spacing:1.2px;color:#5f7867;margin-bottom:8px}
.cmp-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-g>div{background:#fff;border-radius:12px;padding:10px;border:1px solid #e7ebe4}
.cmp-g>div.src{border-color:#9fc59a;background:#f4faef}
.cmp-g b{font-size:10px;font-weight:850;color:#24412f}.cmp-g p{margin:5px 0;font-size:11.5px;line-height:1.45;color:#3f5c4a}
.cmp-g small{font-size:10px;color:#7b9084}.cmp-g a{color:#276747;font-weight:800}

.mrow{padding:8px 0;border-bottom:1px solid #eef1eb}.mrow:last-of-type{border-bottom:0}
.mrow-t{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:750;color:#24412f}

.mbar{height:6px;border-radius:6px;background:#eef2ea;margin:6px 0}.mbar i{display:block;height:100%;border-radius:6px;background:#f2a65a}

let celebrationTimeout=0;
function celebrate(kind,value=0,badge=''){
  const screen=document.querySelector('.screen');if(!screen)return;
  const existing=screen.querySelector('.celebration-layer');if(existing)existing.remove();
  const en=state.lang==='en';const feedback=kind==='feedback';
  const newBadge=badge!=='';const emoji=feedback?'💬':newBadge?'🏆':'🌿';
  const title=feedback?(en?'Thank you!':'感谢你的反馈！'):newBadge?(en?'Badge unlocked!':'解锁新徽章！'):(en?'Great job!':'太棒了！');
  const description=feedback?(en?'Your feedback is saved in this demo. Thanks for helping us improve!':'你的反馈已保存在演示版本中，感谢帮助我们改进！'):newBadge?(en?`You just reached ${badge} points. Keep the momentum going!`:`你已经达到 ${badge} 积分，继续加油！`):(en?`+${value} points added to your impact score.`:`环保影响力积分 +${value}！`);
  const colors=['#c9efa2','#ebf5ce','#f7c68f','#7fd4ba','#ffffff'];
  const confetti=Array.from({length:28},(_,i)=>{
    const angle=(i/28)*Math.PI*2;const dist=105+(i*19)%150;
    const dx=Math.round(Math.cos(angle)*dist),dy=Math.round(Math.sin(angle)*dist);
    return `<span class="confetti-piece" style="--tx:${dx}px;--ty:${dy}px;--spin:${(i%2?1:-1)*(240+i*11)}deg;--delay:${(i*31)%230}ms;--color:${colors[i%colors.length]}"></span>`;
  }).join('');
  const layer=document.createElement('div');layer.className='celebration-layer';layer.setAttribute('role','dialog');layer.setAttribute('aria-modal','true');layer.setAttribute('aria-label',title);
  layer.innerHTML=`${confetti}<div class="celebration-panel"><div class="celebration-emblem">${emoji}</div><div class="celebration-kicker">${feedback?'FEEDBACK':newBadge?'NEW ACHIEVEMENT':'CLIMATE ACTION'}</div><h2>${title}</h2><p>${description}</p><button class="celebration-close" data-action="close-celebration">${en?'Continue exploring':'继续探索'} →</button></div>`;
  screen.appendChild(layer);clearTimeout(celebrationTimeout);
  celebrationTimeout=setTimeout(()=>{if(layer.isConnected)layer.remove()},4200);
}
